<form [formGroup]="chefForm" (ngSubmit)="enregistrer()" class="form-card">
  <div class="form-group">
    <label>Nom complet</label>
    <input type="text" formControlName="fullName" />

    <small *ngIf="chefForm.get('fullName')?.touched && chefForm.get('fullName')?.invalid">
      Le nom est obligatoire.
    </small>
  </div>

  <div class="form-group">
    <label>Photo URL</label>
    <input type="text" formControlName="photo" />

    <small *ngIf="chefForm.get('photo')?.touched && chefForm.get('photo')?.invalid">
      La photo est obligatoire.
    </small>
  </div>

  <div class="form-group">
    <label>Spécialité</label>
    <select formControlName="speciality">
      <option value="">Choisir une spécialité</option>
      <option *ngFor="let spec of specialities$ | async" [value]="spec">
        {{ spec }}
      </option>
    </select>

    <small *ngIf="chefForm.get('speciality')?.touched && chefForm.get('speciality')?.invalid">
      La spécialité est obligatoire.
    </small>
  </div>

  <div class="form-group">
    <label>Années d'expérience</label>
    <input type="number" formControlName="experienceYears" />

    <small *ngIf="chefForm.get('experienceYears')?.touched && chefForm.get('experienceYears')?.hasError('required')">
      L'expérience est obligatoire.
    </small>

    <small *ngIf="chefForm.get('experienceYears')?.touched && chefForm.get('experienceYears')?.hasError('experienceInvalide')">
      L'expérience doit être entre 0 et 50 ans.
    </small>
  </div>

  <div class="form-group">
    <label>Biographie</label>
    <textarea formControlName="bio" rows="4"></textarea>
  </div>

  <div class="form-group">
    <label>Plat signature</label>
    <input type="text" formControlName="signatureDish" />
  </div>

  <div class="actions">
    <button type="submit" class="save-btn">
      Enregistrer
    </button>

    <button type="button" class="cancel-btn" (click)="annuler()">
      Annuler
    </button>
  </div>
</form>
